<style>
/* Layout: barra superior amb pestanyes, contingut en una columna ampla; taules amb scroll propi */
:root{
  --bg:#f5f7f8; --surface:#ffffff; --surface2:#eef2f3; --line:#d9e0e3;
  --fg:#1c2a30; --muted:#5d6f76; --accent:#2f6f73; --accent-fg:#ffffff; --accent-soft:#dcecec;
  --ok:#2e7d4f; --ok-soft:#ddf1e4; --warn:#a4621a; --warn-soft:#fbead3; --bad:#b23b3b; --bad-soft:#f8dddd;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191c; --surface:#1a2428; --surface2:#222e33; --line:#314047;
  --fg:#e3ebee; --muted:#93a6ad; --accent:#6fb3b6; --accent-fg:#0d1a1c; --accent-soft:#1f3a3c;
  --ok:#7fd1a0; --ok-soft:#1d3a2a; --warn:#f0b46a; --warn-soft:#3d2e1a; --bad:#f08f8f; --bad-soft:#3f2222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191c; --surface:#1a2428; --surface2:#222e33; --line:#314047;
  --fg:#e3ebee; --muted:#93a6ad; --accent:#6fb3b6; --accent-fg:#0d1a1c; --accent-soft:#1f3a3c;
  --ok:#7fd1a0; --ok-soft:#1d3a2a; --warn:#f0b46a; --warn-soft:#3d2e1a; --bad:#f08f8f; --bad-soft:#3f2222; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px}
nav.tabs a:hover{background:var(--surface2);color:var(--fg)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
main{padding-block:20px 60px;display:grid;gap:20px}
main>*,.panel>*,form>*{min-width:0}
h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:16px;margin:0 0 12px;text-wrap:balance}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.main{background:var(--accent-soft);border-color:transparent}
.kpi .s{font-size:12px;color:var(--muted)}
label,.lbl{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.ro{background:var(--surface2);border:1px dashed var(--line);border-radius:6px;padding:6px 10px;color:var(--fg);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ro small{font-weight:500;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg);font-weight:500;min-height:35px}
.grid{align-items:end}
.cbx-wrap{position:relative;min-width:0}
.cbx{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:320px;overflow:auto;padding:4px;display:grid;gap:2px}
.cbx-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 2px;font-weight:600}
.cbx-i{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;min-height:42px;border-radius:6px;cursor:pointer;color:var(--fg);font-size:14px}
.cbx-i small{color:var(--muted);font-size:12px}
.cbx-i[aria-selected="true"],.cbx-i:hover{background:var(--accent-soft)}
.cbx-i b{color:var(--accent)}
.cbx-new{color:var(--muted);font-size:13px;padding:8px 10px}
.formfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.pricebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}
.pricebar .cap{font-size:12px;font-weight:600;color:var(--muted)}
label.check input{width:18px;height:18px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface2);font-weight:600}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
td .row{flex-wrap:nowrap}
tfoot td{font-weight:700;background:var(--surface2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:0;cursor:default;font-family:inherit}
button.pill{cursor:pointer}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mut{background:var(--surface2);color:var(--muted)}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{margin:0;background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:13px}
.note b{color:var(--warn)}
.two{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.two>*{min-width:0}
.vlist{display:grid;gap:6px;max-height:300px;overflow:auto;margin:8px 0}
.vlist label{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--fg);font-size:13px;padding:6px 8px;background:var(--surface2);border-radius:6px}
.vlist input{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,24,.5);z-index:40;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:10px;padding:20px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:14px}
/* factura */
.inv{background:#fff;color:#1b1b1b;padding:36px 40px;border:1px solid #ddd;font-size:13px;font-family:var(--f-body)}
.inv h3{font-family:var(--f-display);font-size:26px;margin:0;letter-spacing:-.01em}
.inv .ih{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.inv .parts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.inv .parts div{line-height:1.5}
.inv .cap{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#666;font-weight:600;margin-bottom:3px}
.inv table th{background:#f1f1f1;color:#444}
.inv table td,.inv table th{border-bottom:1px solid #e3e3e3}
.inv .tot{margin-left:auto;margin-top:14px;width:280px;max-width:100%}
.inv .tot div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.inv .tot .g{border-top:2px solid #1b1b1b;font-weight:700;font-size:15px;margin-top:4px;padding-top:8px}
.inv .leg{margin-top:26px;font-size:11px;color:#555;line-height:1.5}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
  .inv{border:0;padding:0}
  body::before{display:none}
}
@media (max-width:560px){.inv{padding:20px}.inv .parts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top"><div class="wrap">
  <div class="brand">Comptes de consulta<small>Psicologia · <span id="brandC">centre</span> i privats</small></div>
  <nav class="tabs" id="tabs">
    <a href="#centre" id="tabC">Visites centre</a>
    <a href="#privats">Pacients privats</a>
    <a href="#pendents">Pendents</a>
    <a href="#pacients">Fitxa de pacient</a>
    <a href="#resum">Resum mensual</a>
    <a href="#factures">Factures</a>
    <a href="#config">Configuració</a>
  </nav>
  <div class="row" style="margin-left:auto"><button class="pill p-mut" id="saveState" title="Estat del desat">Només al navegador</button><button class="btn sm" id="lockBtn" hidden title="Bloqueja l'app">Bloqueja</button></div>
</div></header>
<div class="wrap"><main id="main"></main></div>
<div id="printArea"></div>

<script>
"use strict";
const KEY='comptes-consulta-v1';
const MESOS=['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const ESTATS={feta:'Realitzada',cancel24:'Cancel·lada <24h',absencia:'Absència',cancelada:'Cancel·lada amb temps'};
const COBRA={feta:true,cancel24:true,absencia:true,cancelada:false};
const METODES={efectiu:'Efectiu',bizum:'Bizum',transferencia:'Transferència'};
const DEFAULTS={
  settings:{
    tipus:{
      individual:{nom:'Individual',preu:65,ella:37,centre:28},
      parella:{nom:'Parella',preu:85,ella:47,centre:38}
    },
    preuPrivat:65,
    seriePacient:'F',
    serieCentre:'C',
    nomApp:'',
    nomCentreApp:'',
    prof:{nom:'',nif:'',adreca:'',colegiat:'',email:'',tel:''},
    centre:{nom:'',nif:'',adreca:''},
    mencio:"Operació exempta d'IVA segons l'article 20.Un.3r de la Llei 37/1992, de l'Impost sobre el Valor Afegit (assistència sanitària prestada per professionals de la psicologia)."
  },
  visits:[], invoices:[], rebudes:[], patients:{}, lastBackup:null
};

/* ---------- estat ---------- */
const clone=o=>JSON.parse(JSON.stringify(o));
function mergeDeep(base,over){
  if(over===null||typeof over!=='object'||Array.isArray(over)) return over===undefined?base:over;
  const out=Array.isArray(base)?[]:{...base};
  for(const k of Object.keys(over)) out[k]=(base&&typeof base[k]==='object'&&!Array.isArray(base[k]))?mergeDeep(base[k],over[k]):over[k];
  return out;
}
function migrate(d){
  if(d.settings.tipus.primera) delete d.settings.tipus.primera;
  d.visits.forEach(v=>{if(v.tipus==='primera'){v.tipus='individual';v.primera=true}});
  if(!Array.isArray(d.rebudes)) d.rebudes=[];
  d.visits.forEach(v=>{if(v.origen!=='centre'&&v.origen!=='privat')v.origen='centre'});
  return d;
}
/* ---------- xifratge (AES-256-GCM, clau derivada de la contrasenya amb PBKDF2) ---------- */
const ITER=310000;
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const isEnv=d=>!!(d&&typeof d==='object'&&d.ct&&d.iv&&d.salt);
async function deriveKey(pw,salt,iter=ITER){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,salt,text,savedAt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(text)));return JSON.stringify({app:'comptes-consulta',xifrat:'AES-256-GCM / PBKDF2-SHA256',iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct),savedAt})}
async function unsealKey(key,env){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.ct));return JSON.parse(td.decode(pt))}
async function unseal(pw,env){const salt=unb64(env.salt);const key=await deriveKey(pw,salt,env.iter||ITER);return {key,salt,data:await unsealKey(key,env)}}
let ENC={key:null,salt:null};
let LOCKED=null;
function readStored(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function load(){
  const d=readStored();
  if(isEnv(d)){LOCKED=d;return clone(DEFAULTS)}
  try{if(d) return migrate(mergeDeep(clone(DEFAULTS),d));}catch(e){}
  return clone(DEFAULTS);
}
let S=load();
let storageOk=true, saveChain=Promise.resolve();
async function serialize(){const text=JSON.stringify(S);return ENC.key?await seal(ENC.key,ENC.salt,text,S.savedAt):text}
function saveLocal(){
  if(LOCKED) return saveChain;
  saveChain=saveChain.then(async()=>{const out=await serialize();
    try{localStorage.setItem(KEY,out);storageOk=true}
    catch(e){storageOk=false;toast("No s'han pogut desar les dades en aquest navegador. Fes una còpia de seguretat.");}
  }).catch(()=>{});
  return saveChain;
}
function save(){ if(LOCKED) return; S.savedAt=new Date().toISOString(); S.dirty=true; saveLocal().then(queueFile); }
function promptPassword(title,text){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    bg.innerHTML=`<form class="modal" role="dialog" aria-modal="true" style="max-width:420px"><h2 style="margin:0">${esc(title)}</h2><p style="margin:0">${text}</p><label>Contrasenya<input type="password" id="pp-pw" autocomplete="current-password"></label><div class="row end"><button type="button" class="btn" data-x>Cancel·la</button><button class="btn pri">D'acord</button></div></form>`;
    const done=v=>{bg.remove();res(v)};
    bg.addEventListener('click',e=>{if(e.target===bg||e.target.dataset.x!==undefined)done(null)});
    bg.querySelector('form').addEventListener('submit',e=>{e.preventDefault();done(bg.querySelector('#pp-pw').value)});
    document.body.appendChild(bg);bg.querySelector('#pp-pw').focus();
  });
}
// Converteix el contingut d'un fitxer (xifrat o no) en dades; demana la contrasenya si cal. Retorna null si es cancel·la.
async function decodeData(obj,askText){
  if(!isEnv(obj)){if(!obj||!Array.isArray(obj.visits))throw new Error('format');return obj}
  if(ENC.key&&obj.salt===b64(ENC.salt)){try{return await unsealKey(ENC.key,obj)}catch(e){}}
  let msg=askText;
  for(;;){const pw=await promptPassword('Fitxer protegit',msg); if(pw===null) return null;
    try{return (await unseal(pw,obj)).data}catch(e){msg='Contrasenya incorrecta. Torna-ho a provar.'}}
}

/* ---------- desat automàtic a un fitxer (Chrome / Edge) ---------- */
const FS_OK=(()=>{try{return 'showSaveFilePicker' in window && window.isSecureContext && window.top===window.self}catch(e){return false}})();
let fileH=null,filePerm=false,fileSavedAt=null,fileErr=null,fileTimer=null;
const JSON_TYPES=[{description:'Dades de comptes (JSON)',accept:{'application/json':['.json']}}];
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('comptes-consulta',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function kvSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');const st=t.objectStore('kv');v===undefined?st.delete(k):st.put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
function queueFile(){ if(!fileH||!filePerm){renderSaveState();return} clearTimeout(fileTimer); fileTimer=setTimeout(writeFile,300); }
async function writeFile(){
  try{await saveChain;const out=await serialize();const w=await fileH.createWritable();await w.write(out);await w.close();fileSavedAt=new Date();fileErr=null;}
  catch(e){fileErr=String(e&&e.message||e);filePerm=false;toast("No s'ha pogut desar al fitxer. Clica l'indicador de dalt per reconnectar-lo.");}
  renderSaveState();
}
async function readFileRaw(h){const t=await (await h.getFile()).text();if(!t.trim())return null;const d=JSON.parse(t);if(!isEnv(d)&&!Array.isArray(d.visits))throw new Error('format');return d;}
async function connectNew(){
  try{const h=await window.showSaveFilePicker({suggestedName:'comptes-consulta.json',types:JSON_TYPES});
    fileH=h;filePerm=true;await kvSet('file',h);await writeFile();toast('Fitxer connectat. Cada canvi s\u2019hi desarà sol.');route();}
  catch(e){if(e.name!=='AbortError')toast("No s'ha pogut crear el fitxer");}
}
async function connectExisting(){
  try{
    const [h]=await window.showOpenFilePicker({types:JSON_TYPES});
    if((await h.requestPermission({mode:'readwrite'}))!=='granted'){toast('Cal donar permís per escriure al fitxer');return}
    let d; try{const raw=await readFileRaw(h); d=raw&&await decodeData(raw,'Aquest fitxer està xifrat. Escriu la contrasenya amb què es va desar.'); if(raw&&!d) return;}catch(_){toast('Aquest fitxer no conté dades de l\u2019app');return}
    const go=async()=>{fileH=h;filePerm=true;await kvSet('file',h);if(d){S=migrate(mergeDeep(clone(DEFAULTS),d));saveLocal();await writeFile();}else await writeFile();toast('Fitxer connectat');route();};
    if(d) confirmBox(`El fitxer té <b>${d.visits.length}</b> visites i <b>${(d.invoices||[]).length}</b> factures. Les dades d'aquest navegador se substituiran per les del fitxer.`,'Carrega el fitxer',go); else go();
  }catch(e){if(e.name!=='AbortError')toast("No s'ha pogut obrir el fitxer");}
}
async function syncOnOpen(){
  try{const raw=await readFileRaw(fileH);
    if(raw&&(raw.savedAt||'')>(S.savedAt||'')){
      let d=null;
      if(!isEnv(raw)) d=raw; else if(ENC.key&&raw.salt===b64(ENC.salt)) d=await unsealKey(ENC.key,raw);
      if(!d){fileErr='El fitxer té una altra contrasenya';filePerm=false;toast("El fitxer connectat està protegit amb una altra contrasenya. No l'he tocat.");renderSaveState();return}
      S=migrate(mergeDeep(clone(DEFAULTS),d));saveLocal();fileSavedAt=new Date();fileErr=null;toast('Dades carregades del fitxer');route();}
    else await writeFile();
  }catch(e){fileErr='No es pot llegir el fitxer';filePerm=false;}
  renderSaveState();
}
async function reconnect(){
  try{if((await fileH.requestPermission({mode:'readwrite'}))!=='granted')return;filePerm=true;fileErr=null;await syncOnOpen();}
  catch(e){toast("No s'ha trobat el fitxer. Torna'l a connectar des de Configuració.");}
}
async function initFile(){
  if(!FS_OK){renderSaveState();return}
  const h=await kvGet('file'); if(!h){renderSaveState();return}
  fileH=h;
  try{filePerm=(await h.queryPermission({mode:'readwrite'}))==='granted'}catch(e){filePerm=false}
  if(filePerm) await syncOnOpen(); else renderSaveState();
}
function disconnectFile(){fileH=null;filePerm=false;fileSavedAt=null;fileErr=null;kvSet('file',undefined);route();toast('Fitxer desconnectat. Les dades queden al navegador.');}
const backupDays=()=>S.lastBackup?Math.floor((Date.now()-Date.parse(S.lastBackup))/864e5):null;
function renderSaveState(){
  const el=document.getElementById('saveState'); if(!el) return;
  let cls,txt;
  if(fileH&&filePerm&&!fileErr){cls='p-ok';txt=fileSavedAt?`Desat al fitxer · ${String(fileSavedAt.getHours()).padStart(2,'0')}:${String(fileSavedAt.getMinutes()).padStart(2,'0')}`:'Fitxer connectat';}
  else if(fileH){cls='p-warn';txt='Fitxer pendent · clica per reconnectar';}
  else{const d=backupDays();
    if(!S.visits.length){cls='p-mut';txt='Només al navegador';}
    else if(d===null||d>7){cls='p-bad';txt=FS_OK?'Sense fitxer de dades · connecta\u2019n un':'Fa temps que no fas còpia';}
    else{cls='p-mut';txt=`Última còpia fa ${d} dies`;}}
  el.className='pill '+cls; el.textContent=txt;
  const lb=document.getElementById('lockBtn'); if(lb) lb.hidden=!ENC.key||!!LOCKED;
}

/* ---------- cercador de pacients ---------- */
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function pacientsInfo(){ // [{nom,ultima,n}] ordenats per visita més recent
  const m={};
  S.visits.forEach(v=>{const o=(m[v.pacient]??={nom:v.pacient,ultima:'',n:0});o.n++;if(v.data>o.ultima)o.ultima=v.data});
  return Object.values(m).sort((a,b)=>b.ultima.localeCompare(a.ultima));
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
// Si el nom no existeix però s'assembla a un altre (majúscules, accents, ordre o 1-2 lletres), retorna el nom existent
function semblant(nom){
  const all=pacientsInfo().map(x=>x.nom); if(all.includes(nom)) return null;
  const n=norm(nom), sorted=t=>norm(t).split(' ').sort().join(' ');
  let best=null,bd=99;
  for(const p of all){const q=norm(p);
    if(q===n||sorted(p)===sorted(nom)) return p;
    const d=lev(n,q), lim=n.length<6?1:2;
    if(d<=lim&&d<bd){bd=d;best=p}
    else if(n.length>=4&&(q.startsWith(n+' ')||n.startsWith(q+' '))&&!best){best=p;bd=lim}
  }
  return best;
}
function hilite(nom,q){ if(!q) return esc(nom);
  const n=norm(nom), i=n.indexOf(q); if(i<0) return esc(nom);
  return esc(nom.slice(0,i))+'<b>'+esc(nom.slice(i,i+q.length))+'</b>'+esc(nom.slice(i+q.length)); }
function attachPacientSearch(input,{onPick,showNew=true}={}){
  const wrap=document.createElement('div');wrap.className='cbx-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);
  input.setAttribute('autocomplete','off');input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');
  let list=null,items=[],sel=-1;
  const close=()=>{if(list){list.remove();list=null}input.setAttribute('aria-expanded','false');sel=-1};
  const pick=nom=>{input.value=nom;close();onPick&&onPick(nom)};
  const render=()=>{
    const q=norm(input.value), info=pacientsInfo();
    let res,head;
    if(!q){res=info.slice(0,5);head='Recents'}
    else{res=info.filter(x=>norm(x.nom).includes(q)).sort((a,b)=>(norm(b.nom).startsWith(q)-norm(a.nom).startsWith(q))||b.ultima.localeCompare(a.ultima)).slice(0,8);head=null}
    items=res.map(x=>x.nom);
    if(!list){list=document.createElement('div');list.className='cbx';list.setAttribute('role','listbox');wrap.appendChild(list);
      list.addEventListener('pointerdown',e=>e.preventDefault());
      list.addEventListener('click',e=>{const b=e.target.closest('[data-nom]');if(b)pick(b.dataset.nom)});}
    const exact=items.some(n=>n===input.value.trim());
    list.innerHTML=(head&&res.length?`<div class="cbx-h">${head}</div>`:'')+
      res.map((x,i)=>`<button type="button" class="cbx-i" role="option" data-nom="${esc(x.nom)}" aria-selected="${i===sel}"><span>${hilite(x.nom,q)}</span><small>${x.n} visit${x.n>1?'es':'a'} · ${dmy(x.ultima)}</small></button>`).join('')+
      (q&&!res.length?`<div class="cbx-new">${showNew?'Pacient nou: es crearà en desar la visita.':'Cap pacient coincideix.'}</div>`:'')+
      (q&&res.length&&!exact&&showNew?`<div class="cbx-new">Si és un pacient nou, continua escrivint el nom complet.</div>`:'');
    if(!res.length&&!q){close();return}
    input.setAttribute('aria-expanded','true');
  };
  input.addEventListener('focus',render);
  input.addEventListener('input',()=>{sel=-1;render()});
  input.addEventListener('blur',()=>setTimeout(close,120));
  input.addEventListener('keydown',e=>{
    if(!list) return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;render();}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault();pick(items[sel]);}
    else if(e.key==='Escape'){close();}
  });
}

    else if(+$('#f-preu').value===0) $('#f-preu').value=S.settings.preuPrivat;
  });
  $('#f-pagat').addEventListener('change',()=>{ if($('#f-pagat').checked&&!$('#f-metode').value) $('#f-metode').focus(); });
  $('#f-cancel')?.addEventListener('click',()=>{editId=null;route()});
  $('#xlsx-mes').addEventListener('click',()=>exportXlsx(S.visits.filter(v=>v.origen===origen&&ym(v.data)===curMonth),`visites-${isC?'centre':'privats'}-${curMonth}.xlsx`,isC?CN()+' '+curMonth:'Privats '+curMonth));
  f.addEventListener('submit',e=>{
    e.preventDefault();
    if(locked){ ed.pagat=$('#f-pagat').checked; ed.metode=$('#f-metode').value; save(); editId=null; toast('Pagament actualitzat'); route(); return; }
    const c=isC?cPrice():(()=>{const pr=r2($('#f-preu').value);return {preu:pr,ella:pr,centre:0}})();
    const v={id:ed?ed.id:uid(),origen,data:$('#f-data').value,pacient:$('#f-pacient').value.trim(),tipus:isC?$('#f-tipus').value:'privat',primera:isC&&$('#f-primera').checked,
      estat:$('#f-estat').value,preu:c.preu,ella:c.ella,centre:c.centre,manual:isC&&!!override,
      pagat:$('#f-pagat').checked,metode:$('#f-metode').value,facturaId:ed?.facturaId||null};
    if(!v.pacient||!v.data){toast('Cal la data i el nom del pacient');return}
    const commit=()=>{ if(ed) Object.assign(ed,v); else S.visits.push(v);
      curMonth=ym(v.data); save(); editId=null; toast(ed?'Visita actualitzada':'Visita afegida'); route(); };
    const sem=(!ed||ed.pacient!==v.pacient)?semblant(v.pacient):null;
    if(sem){
      confirmBox(`<p style="margin:0 0 6px">No hi ha cap pacient que es digui <b>${esc(v.pacient)}</b></p><p style="margin:0">Vols dir <b>${esc(sem)}</b>?</p>`,`Sí, és ${sem}`,()=>{v.pacient=sem;commit()},false,'No, és un pacient nou',commit);
      return;
    }
    commit();
  });
  $('#main').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.pay){const v=S.visits.find(x=>x.id===b.dataset.pay);v.pagat=!v.pagat;save();route();}
    else if(b.dataset.edit){editId=b.dataset.edit;route();$('#vform').scrollIntoView({behavior:'smooth',block:'start'});}
    else if(b.dataset.del){const v=S.visits.find(x=>x.id===b.dataset.del);confirmBox(`Vols esborrar la visita de <b>${esc(v.pacient)}</b> del ${dmy(v.data)}?`,'Esborra',()=>{S.visits=S.visits.filter(x=>x.id!==v.id);save();route();toast('Visita esborrada')},true);}
    else if(b.id==='sample'){loadSample();}
    else if(b.dataset.fitxa){fitxaPac=b.dataset.fitxa;fitxaMes='';location.hash='#pacients';}
  };
}
function bindMonth(){ $('#mes')?.addEventListener('change',e=>{ if(e.target.value){curMonth=e.target.value;editId=null;route();} }); }

/* ===== Cobraments pendents ===== */

const origenTxt=v=>v.origen==='centre'?CN():'Privat';

    </div>

/* ===== Fitxa de pacient ===== */

  const deuteTotal=r2(allP.filter(v=>cobrable(v)&&!v.pagat).reduce((s,v)=>s+v.preu,0));

    <label style="min-width:170px">Mes<select id="fx-mes"><option value="" ${!fitxaMes?'selected':''}>Tots els mesos</option>${mesos.map(m=>`<option value="${m}" ${m===fitxaMes?'selected':''}>${cap(mesNom(m))}${allP.some(v=>ym(v.data)===m)?'':' (cap visita)'}</option>`).join('')}</select></label></div>`:''}</div>

  ${fitxaMes&&deuteTotal>r2(pend.reduce((s,v)=>s+v.preu,0))?`<p class="note"><b>Deute total de tots els mesos: ${eur(deuteTotal)}.</b> Aquí només es veu el de ${mesNom(fitxaMes)}. <button class="btn sm" id="fx-all">Mostra tots els mesos</button></p>`:''}
  ${!all.length?`<div class="panel empty">${esc(fitxaPac)} no té cap visita a ${quan}.</div>`:''}
  <div class="kpis">
    <div class="kpi"><div class="l">Visites · ${quan}</div><div class="v">${all.length}</div><div class="s">${cob.length} cobrables${all.length-cob.length?` · ${all.length-cob.length} sense cost`:''}</div></div>

  :`<div class="panel empty">No hi ha visites cobrables ${esc(delC())} a ${mesNom(curMonth)}.</div>`}
  <div class="two">
    <section class="panel"><h2>Liquidació amb ${esc(elC())}</h2>
      <p style="margin:0 0 8px">Segons les visites, la part ${esc(delC())} per ${mesNom(curMonth)} és <b>${eur(sum('centre'))}</b>.</p>
      ${rb.length?`<p style="margin:0 0 12px">Factura${rb.length>1?'es':''} rebuda${rb.length>1?'es':''}: ${rb.map(r=>`<b>${esc(r.num)}</b> (${eur(r.import)}, ${r.pagada?'pagada el '+dmy(r.dataPagament):'pendent de pagar'})`).join(', ')}.</p>
      ${Math.abs(rbTot-sum('centre'))>0.009?`<p class="note"><b>No quadra.</b> ${esc(cap(elC()))} factura ${eur(rbTot)} i les visites diuen ${eur(sum('centre'))} (diferència ${eur(rbTot-sum('centre'))}). Revisa les visites del mes o parla-ho amb ${esc(elC())}.</p>`:'<p class="muted" style="margin:0">L\u2019import de la factura quadra amb les visites.</p>'}`

/* ===== Pàgina 4: factures ===== */
function invNum(id){return S.invoices.find(i=>i.id===id)?.num||'?'}
function nextNumber(serie,any){
  const ns=S.invoices.filter(i=>i.serie===serie&&i.any===any).map(i=>i.n);
  const n=(ns.length?Math.max(...ns):0)+1;
  const pref=serie==='P'?S.settings.seriePacient:S.settings.serieCentre;
  return {n,num:`${pref}${any}-${String(n).padStart(3,'0')}`};
}
function lastOfSerie(serie,any){return S.invoices.filter(i=>i.serie===serie&&i.any===any).sort((a,b)=>b.n-a.n)[0]}

  $('#main').innerHTML=`

  ${missing?`<p class="note"><b>Falten les dades fiscals de ${esc(PN())}.</b> Omple el nom i el NIF a <a href="#config">Configuració</a> abans d'emetre factures.</p>`:''}
  <div class="two">
    <form class="panel" id="fp"><h2>Factura a un pacient</h2>

  <section><h2>Factures emeses</h2>

  ${invs.map(i=>{const last=lastOfSerie(i.serie,i.any)?.id===i.id;return `<tr><td><b>${esc(i.num)}</b></td><td>${dmy(i.data)}</td><td>${esc(i.client.nom)}</td><td class="n">${eur(i.base)}</td><td class="n">${i.irpf?'−'+eur(i.irpf):'—'}</td><td class="n">${eur(i.total)}</td>
  <td><div class="row"><button class="btn sm" data-view="${i.id}">Veure / imprimir</button>${last?`<button class="btn sm danger" data-delinv="${i.id}" title="Només es pot esborrar l'última de cada sèrie">Esborra</button>`:''}</div></td></tr>`}).join('')}
  </tbody></table></div>`:'<div class="panel empty">Encara no has emès cap factura.</div>'}
  </section>
  <section><h2>Factures rebudes ${esc(delC())}</h2>
  ${rbs.length?`<div class="tbl"><table><thead><tr><th>Número</th><th>Data</th><th>Mes</th><th class="n">Import</th><th class="n">Segons visites</th><th>Pagament</th><th></th></tr></thead><tbody>
  ${rbs.map(r=>{const exp=centreDe(r.mes);const tot=r2(rebudesDe(r.mes).reduce((a,x)=>a+x.import,0));const ok=Math.abs(tot-exp)<0.01;return `<tr><td><b>${esc(r.num)}</b></td><td>${dmy(r.data)}</td><td>${mesNom(r.mes)}</td><td class="n">${eur(r.import)}</td><td class="n">${eur(exp)} ${ok?'':'<span class="pill p-warn">No quadra</span>'}</td>
  <td><button class="pill ${r.pagada?'p-ok':'p-bad'}" data-rpay="${r.id}">${r.pagada?'Pagada '+dmy(r.dataPagament):'Pendent'}</button></td><td><button class="btn sm danger" data-rdel="${r.id}">Esborra</button></td></tr>`}).join('')}
  </tbody></table></div>`:'<div class="panel empty">Encara no has registrat cap factura '+esc(delC())+'.</div>'}
  </section>`;

  const upd=()=>{const ids=[...document.querySelectorAll('#fp .vlist input:checked')].map(x=>x.value);const t=r2(pend.filter(v=>ids.includes(v.id)).reduce((s,v)=>s+v.preu,0));const el=$('#fp-tot');if(el)el.textContent=`Total: ${eur(t)}`};
  upd();
  $('#fp-pac')?.addEventListener('change',e=>{selPac=e.target.value;viewFactures()});
  $('#fp')?.addEventListener('change',upd);
  const hint=()=>{const m=$('#fr-mes').value;if(!m)return;const e=centreDe(m);const imp=r2($('#fr-imp').value);$('#fr-hint').innerHTML=`Segons les visites, la part ${esc(delC())} a ${mesNom(m)} és <b>${eur(e)}</b>.`+(imp&&Math.abs(imp-e)>0.009?` <span class="pill p-warn">Diferència ${eur(imp-e)}</span>`:'')};
  hint();
  $('#fr-mes').addEventListener('change',()=>{$('#fr-imp').value=centreDe($('#fr-mes').value);hint()});
  $('#fr-imp').addEventListener('input',hint);
  $('#fp')?.addEventListener('submit',e=>{
    e.preventDefault();
    const ids=[...document.querySelectorAll('#fp .vlist input:checked')].map(x=>x.value);
    if(!ids.length){toast('Tria almenys una visita');return}
    const data=$('#fp-data').value;
    if(!checkDate('P',data)) return;
    S.patients[selPac]={nif:$('#fp-nif').value.trim(),adreca:$('#fp-adr').value.trim()};
    const sel=S.visits.filter(v=>ids.includes(v.id)).sort((a,b)=>a.data.localeCompare(b.data));
    const linies=sel.map(v=>({data:v.data,concepte:concepte(v),import:v.preu}));
    const base=r2(linies.reduce((s,l)=>s+l.import,0));
    const inv=makeInv('P',data,{nom:selPac,...S.patients[selPac]},linies,base,0,sel.map(v=>v.id));
    sel.forEach(v=>v.facturaId=inv.id);
    save(); toast(`Factura ${inv.num} emesa`); viewFactures(); showInv(inv.id);
  });
  $('#fr').addEventListener('submit',e=>{
    e.preventDefault();

  $('#main').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;

  };
}
function concepte(v){
  const base=v.origen==='centre'?`Sessió de psicologia (${tipusNom(v.tipus).toLowerCase()}${v.primera?', primera visita':''})`:'Sessió de psicologia';
  if(v.estat==='cancel24') return base+' · cancel·lada amb menys de 24 h';
  if(v.estat==='absencia') return base+' · no presentat';
  return base;
}
function checkDate(serie,data){
  const any=+data.slice(0,4); const last=lastOfSerie(serie,any);
  if(last&&data<last.data){toast(`La data no pot ser anterior a la de l'última factura (${last.num}, ${dmy(last.data)})`);return false}
  return true;
}
function makeInv(serie,data,client,linies,base,irpfPct,visitIds){
  const any=+data.slice(0,4); const {n,num}=nextNumber(serie,any);
  const irpf=r2(base*irpfPct/100);
  const inv={id:uid(),serie,any,n,num,data,client,linies,base,ivaPct:0,irpfPct,irpf,total:r2(base-irpf),visitIds,emissor:clone(S.settings.prof),mencio:S.settings.mencio,creada:new Date().toISOString()};
  S.invoices.push(inv); return inv;
}
function invHTML(i){
  const e=i.emissor;
  return `<div class="inv">
   <div class="ih"><div><h3>Factura</h3><div style="margin-top:4px">Núm. <b>${esc(i.num)}</b><br>Data: ${dmy(i.data)}</div></div>
   <div style="text-align:right"><b>${esc(e.nom||'[Nom de la professional]')}</b><br>${e.colegiat?'Psicòloga col·legiada núm. '+esc(e.colegiat)+'<br>':''}NIF: ${esc(e.nif||'[NIF]')}<br>${esc(e.adreca||'')}${e.email||e.tel?'<br>'+esc([e.email,e.tel].filter(Boolean).join(' · ')):''}</div></div>
   <div class="parts"><div><div class="cap">Facturat a</div><b>${esc(i.client.nom)}</b>${i.client.nif?'<br>NIF: '+esc(i.client.nif):''}${i.client.adreca?'<br>'+esc(i.client.adreca):''}</div></div>
   <table><thead><tr><th>Data</th><th>Concepte</th><th class="n">Import</th></tr></thead><tbody>
   ${i.linies.map(l=>`<tr><td>${dmy(l.data)}</td><td style="white-space:normal">${esc(l.concepte)}</td><td class="n">${eur(l.import)}</td></tr>`).join('')}
   </tbody></table>
   <div class="tot"><div><span>Base imposable</span><span>${eur(i.base)}</span></div><div><span>IVA (0%, exempt)</span><span>${eur(0)}</span></div>
   ${i.irpfPct?`<div><span>Retenció IRPF (${i.irpfPct}%)</span><span>−${eur(i.irpf)}</span></div>`:''}
   <div class="g"><span>Total</span><span>${eur(i.total)}</span></div></div>
   <div class="leg">${esc(i.mencio)}</div></div>`;
}
function showInv(id){
  const i=S.invoices.find(x=>x.id===id); if(!i) return;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Factura ${esc(i.num)}</h2><div class="row"><button class="btn pri" data-print>Imprimeix o desa en PDF</button><button class="btn" data-x>Tanca</button></div></div><div style="overflow-x:auto">${invHTML(i)}</div></div>`;
  bg.addEventListener('click',e=>{
    if(e.target===bg||e.target.dataset.x!==undefined) bg.remove();
    if(e.target.dataset.print!==undefined){$('#printArea').innerHTML=invHTML(i);document.title=i.num;window.print();setTimeout(()=>document.title='Comptes de consulta',500);}
  });
  document.body.appendChild(bg);
}

  </section>
  <section class="panel" id="pw-sec">

    ${ENC.key?`<p style="margin:0 0 12px"><span class="pill p-ok">Activada</span> Les dades d'aquest ${IOS?'iPad':'navegador'}, el fitxer de desat automàtic i les còpies de seguretat es guarden xifrades. L'app es bloqueja sola després de 15 minuts sense fer-la servir o 10 minuts en segon pla.</p>
      <form id="pw-chg" class="grid"><label>Contrasenya actual<input type="password" id="pc-cur" autocomplete="current-password"></label><label>Contrasenya nova<input type="password" id="pc-n1" autocomplete="new-password"></label><label>Repeteix-la<input type="password" id="pc-n2" autocomplete="new-password"></label><div class="row" style="align-self:end"><button class="btn pri">Canvia la contrasenya</button></div></form>

    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=async()=>{
      let d; try{d=await decodeData(JSON.parse(rd.result),'Aquesta còpia està xifrada. Escriu la contrasenya amb què es va fer.'); if(!d) return;}catch(_){toast('Aquest fitxer no és una còpia vàlida');return}
      confirmBox(`La còpia té <b>${d.visits.length}</b> visites i <b>${(d.invoices||[]).length}</b> factures. Substituirà totes les dades actuals.`,'Restaura',()=>{S=migrate(mergeDeep(clone(DEFAULTS),d));save();toast('Còpia restaurada');viewConfig();},true);
    }; rd.readAsText(f);
  });
  $('#wipe').addEventListener('click',()=>confirmBox('Vols esborrar <b>totes</b> les visites, factures i configuració d’aquest navegador? Fes abans una còpia de seguretat.','Esborra-ho tot',()=>{S=clone(DEFAULTS);ENC={key:null,salt:null};save();toast('Dades esborrades');viewConfig();},true));
}

/* ---------- fitxers: còpia, Excel ---------- */
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function deliverFile(blob,name){
  if(IOS&&navigator.canShare){
    const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f]});return true}catch(e){if(e.name==='AbortError')return false}
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); return true;
}
async function doBackup(){
  await saveChain;
  const blob=new Blob([await serialize()],{type:'application/json'});
  if(await deliverFile(blob,`comptes-consulta-${today()}.json`)){S.lastBackup=new Date().toISOString();S.dirty=false;await saveLocal();queueFile();toast('Còpia feta');if(!LOCKED)route();return true}
  return false;
}
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){ // files: [[name,string]] -> Uint8Array (sense compressió)
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const [name,str] of files){
    const nb=enc.encode(name),db=enc.encode(str),crc=crc32(db);
    const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)];
    const lh=new Uint8Array([...u32(0x04034b50),...common]);
    parts.push(lh,nb,db);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length;
  }
  const cs=cen.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  const all=[...parts,...cen,end],out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;for(const x of all){out.set(x,p);p+=x.length}
  return out;
}
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function exportXlsx(visits,fname,sheetName){
  const vs=[...visits].sort((a,b)=>a.data.localeCompare(b.data)||a.pacient.localeCompare(b.pacient,'ca'));
  if(!vs.length){toast('No hi ha visites per exportar');return}
  const head=['Data','Pacient','Pagat','Tipus de visita','Preu (€)',CN()+' (€)',PN()+' (€)','Forma de pagament','Estat','Origen','Preu manual'];
  const col=i=>String.fromCharCode(65+i);
  const serial=d=>(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-Date.UTC(1899,11,30))/864e5;
  const str=(r,i,v,st=0)=>`<c r="${col(i)}${r}" t="inlineStr"${st?` s="${st}"`:''}><is><t>${xe(v)}</t></is></c>`;
  const num=(r,i,v,st)=>`<c r="${col(i)}${r}" s="${st}"><v>${v}</v></c>`;
  let rows=`<row r="1">${head.map((h,i)=>str(1,i,h,3)).join('')}</row>`;
  vs.forEach((v,k)=>{const r=k+2;const charged=cobrable(v);
    rows+=`<row r="${r}">${num(r,0,serial(v.data),1)}${str(r,1,v.pacient)}${str(r,2,!charged?'—':v.pagat?'Sí':'No')}${str(r,3,v.origen==='centre'?tipusTxt(v):'Privat')}${num(r,4,v.preu,2)}${num(r,5,v.centre||0,2)}${num(r,6,v.ella,2)}${str(r,7,METODES[v.metode]||'')}${str(r,8,ESTATS[v.estat])}${str(r,9,v.origen==='centre'?CN():'Privat')}${str(r,10,v.manual?'Sí':'')}</row>`;});
  const L=vs.length+1,T=L+1;
  rows+=`<row r="${T}">${str(T,0,'Total',3)}${[4,5,6].map(i=>`<c r="${col(i)}${T}" s="4"><f>SUM(${col(i)}2:${col(i)}${L})</f></c>`).join('')}</row>`;
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${[12,28,8,24,11,11,11,18,22,9,12].map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData><autoFilter ref="A1:K${L}"/></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00\ &quot;€&quot;"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const sn=xe(sheetName.replace(/[\\\/?*\[\]:]/g,' ').slice(0,31));
  const files=[
    ['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${sn}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${sn}'!$A$1:$K$${L}</definedName></definedNames></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/worksheets/sheet1.xml',sheet],['xl/styles.xml',styles]];
  window.__lastXlsx=zipStore(files);
  deliverFile(new Blob([window.__lastXlsx],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fname);
}
function backupBanner(){
  if(S.visits.length&&!ENC.key&&location.hash!=='#config') $('#main').insertAdjacentHTML('afterbegin',`<p class="note row" style="justify-content:space-between"><span><b>Les dades no tenen contrasenya.</b> Qualsevol persona amb accés a ${IOS?'l\u2019iPad':'aquest ordinador'} pot veure-les.</span><a class="btn sm" href="#config">Posa una contrasenya</a></p>`);
  if(!S.visits.length||(fileH&&filePerm)) return;
  const d=backupDays();
  if(d!==null&&d<=7){
    // Recordatori diari: hi ha canvis des de l'última còpia i avui encara no se n'ha fet cap
    if(pendingBackup()){
      $('#main').insertAdjacentHTML('afterbegin',`<p class="note row" style="justify-content:space-between;background:var(--accent-soft)"><span><b style="color:var(--accent)">Hi ha canvis que encara no tenen còpia de seguretat.</b> Desa-la abans d'acabar el dia a ${IOS?'iCloud Drive':'un lloc segur'}.</span><button class="btn pri sm" id="bk-now">${IOS?'Desa una còpia a iCloud':'Fes una còpia ara'}</button></p>`);
      $('#bk-now').addEventListener('click',doBackup);
    }
    return;
  }
  $('#main').insertAdjacentHTML('afterbegin',`<p class="note row" style="justify-content:space-between"><span><b>${d===null?'Encara no has fet cap còpia de seguretat.':`Fa ${d} dies que no fas cap còpia de seguretat.`}</b> Si es perd ${IOS?'l\u2019iPad':'aquest navegador'}, es perdrien les dades.</span><button class="btn pri sm" id="bk-now">${IOS?'Desa una còpia a iCloud':'Fes una còpia ara'}</button></p>`);
  $('#bk-now').addEventListener('click',doBackup);
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&window.top===window.self){navigator.serviceWorker.register('sw.js').catch(()=>{});}
try{navigator.storage?.persist?.()}catch(e){}
document.getElementById('saveState').addEventListener('click',()=>{ if(fileH&&!filePerm) reconnect(); else location.hash='#config'; });
function viewLock(){
  $('#tabs').hidden=true; $('#saveState').hidden=true; $('#lockBtn').hidden=true;
  $('#main').innerHTML=`<form class="panel" id="lk" style="max-width:380px;margin:40px auto 0;width:100%;display:grid;gap:12px">
    <h1>Comptes de consulta</h1><p class="muted" style="margin:0">Les dades estan protegides. Escriu la contrasenya per obrir l'app.</p>
    <label>Contrasenya<input type="password" id="lk-pw" autocomplete="current-password" autofocus></label>
    <p id="lk-err" style="margin:0;color:var(--bad)" hidden>Contrasenya incorrecta.</p>
    <button class="btn pri" id="lk-go">Obre</button>
    <details><summary class="muted" style="cursor:pointer">He oblidat la contrasenya</summary>
      <p style="font-size:13px">Les dades estan xifrades i sense la contrasenya no es poden recuperar. Si tens una còpia de seguretat antiga sense contrasenya, o en recordes la contrasenya, pots començar de zero i restaurar-la des de Configuració.</p>
      <button type="button" class="btn danger" id="lk-wipe">Esborra-ho tot i comença de zero</button></details>
  </form>`;
  $('#lk').addEventListener('submit',async e=>{
    e.preventDefault(); const b=$('#lk-go'); b.disabled=true; b.textContent='Obrint…';
    try{const r=await unseal($('#lk-pw').value,LOCKED);
      ENC={key:r.key,salt:r.salt}; S=migrate(mergeDeep(clone(DEFAULTS),r.data)); LOCKED=null;
      $('#tabs').hidden=false; $('#saveState').hidden=false; route(); renderSaveState(); initFile();
    }catch(_){ $('#lk-err').hidden=false; b.disabled=false; b.textContent='Obre'; $('#lk-pw').select(); }
  });
  $('#lk-wipe').addEventListener('click',()=>confirmBox('Segur que vols esborrar totes les dades protegides d\u2019aquest dispositiu? No es podrà desfer.','Esborra-ho tot',()=>{try{localStorage.removeItem(KEY)}catch(e){} kvSet('file',undefined); location.reload();},true));
}
async function lockNow(){ if(!ENC.key||LOCKED) return; await saveChain; location.reload(); }
const localDay=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function pendingBackup(){ return !!(S.visits.length&&!(fileH&&filePerm)&&S.dirty!==false&&(!S.lastBackup||localDay(S.lastBackup)!==today())); }
let lastAct=Date.now(), hiddenAt=0;
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) hiddenAt=Date.now(); else if(hiddenAt&&Date.now()-hiddenAt>10*60e3) lockNow(); });
setInterval(()=>{ if(Date.now()-lastAct>15*60e3) lockNow(); },30e3);
document.getElementById('lockBtn').addEventListener('click',()=>{
  if(!pendingBackup()) return lockNow();
  confirmBox('<b>Hi ha canvis que encara no tenen còpia de seguretat.</b> Vols desar-la abans de bloquejar l\u2019app?',IOS?'Desa una còpia a iCloud':'Fes una còpia ara',async()=>{await doBackup();lockNow();},false,'Bloqueja sense còpia',lockNow);
});
route();
if(!LOCKED) initFile();
</script>
